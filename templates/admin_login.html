<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MONO 관리자 로그인</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body class="admin-login-body">

    <div class="admin-login-container">

        <a
            href="/"
            class="admin-login-logo"
        >
            MONO
        </a>

        <div class="admin-login-box">

            <h1>
                관리자 로그인
            </h1>

            <p class="admin-login-description">
                관리자 계정으로 로그인해주세요.
            </p>


            {% if error %}

            <div class="admin-login-error">
                {{ error }}
            </div>

            {% endif %}


            <form
                method="POST"
                class="admin-login-form"
            >

                <div class="admin-login-field">

                    <label>
                        관리자 아이디
                    </label>

                    <input
                        type="text"
                        name="username"
                        placeholder="관리자 아이디"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="admin-login-field">

                    <label>
                        비밀번호
                    </label>

                    <input
                        type="password"
                        name="password"
                        placeholder="비밀번호"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="admin-login-button"
                >
                    로그인
                </button>

            </form>


            <a
                href="/"
                class="admin-login-home"
            >
                쇼핑몰로 돌아가기
            </a>

        </div>

    </div>

</body>

</html>
