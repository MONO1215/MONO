<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        MONO 회원가입
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body class="user-login-body">


<div class="user-login-container">

    <a
        href="/"
        class="user-login-logo"
    >
        MONO
    </a>


    <div class="user-login-box">

        <h1>
            회원가입
        </h1>


        {% if error %}

        <div class="user-login-error">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST" id="mono_register_form">
            <input type="hidden" name="register_csrf" value="{{ register_csrf }}">


            <div class="user-login-field">

                <label>
                    이름
                </label>

                <input
                    type="text"
                    name="name"
                    required
                >

            </div>


            <div class="user-login-field">

                <label>
                    아이디
                </label>

                <div style="display:flex;gap:8px;align-items:center;">
                    <input
                        id="register_username"
                        type="text"
                        name="username"
                        autocomplete="username"
                        maxlength="50"
                        value="{{ request.form.get('username', '') }}"
                        required
                        style="min-width:0;flex:1;"
                    >
                    <button id="check_username_button" type="button" onclick="checkMonoUsername()" style="padding:11px;border:1px solid #ddd;border-radius:7px;background:#fff;white-space:nowrap;cursor:pointer;">중복 확인</button>
                </div>
                <div id="username_check_message" role="status" aria-live="polite" style="margin-top:7px;font-size:13px;"></div>

            </div>


            <div class="user-login-field">

                <label>
                    전화번호
                </label>

                <input
                    type="tel"
                    name="phone"
                    placeholder="010-1234-5678"
                >

            </div>



            <div class="user-login-field">
                <label for="postal_code">우편번호</label>
                <div style="display:flex;gap:8px;align-items:center;">
                    <input id="postal_code" type="text" name="postal_code" maxlength="5" pattern="[0-9]{5}" inputmode="numeric" placeholder="우편번호" value="{{ request.form.get('postal_code', '') }}" required style="min-width:0;flex:1;">
                    <button type="button" onclick="searchMonoAddress()" style="padding:11px;border:1px solid #ddd;border-radius:7px;background:#fff;white-space:nowrap;">주소 검색</button>
                </div>
            </div>
            <div class="user-login-field">
                <label for="address">배송지 주소</label>
                <input id="address" type="text" name="address" maxlength="300" placeholder="기본 주소" value="{{ request.form.get('address', '') }}" required>
            </div>
            <div class="user-login-field">
                <label for="address_detail">상세 주소</label>
                <input id="address_detail" type="text" name="address_detail" maxlength="300" placeholder="동·호수 등" value="{{ request.form.get('address_detail', '') }}">
            </div>

            <div class="user-login-field">

                <label>
                    이메일
                </label>

                <input
                    type="email"
                    name="email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="user-login-field">

                <label>
                    비밀번호
                </label>

                <input
                    type="password"
                    name="password"
                    autocomplete="new-password"
                    required
                >

            </div>


            <div class="user-login-field">

                <label>
                    비밀번호 확인
                </label>

                <input
                    type="password"
                    name="password_confirm"
                    autocomplete="new-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="user-login-button"
            >
                회원가입
            </button>

        </form>


        <a
            href="/login"
            class="user-register-link"
        >
            이미 계정이 있나요? 로그인
        </a>

    </div>

</div>



<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script>
function searchMonoAddress() {
    if (!window.daum || !daum.Postcode) {
        alert('주소 검색 서비스를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.');
        return;
    }
    new daum.Postcode({oncomplete: function(data) {
        const form = document.querySelector('form');
        form.elements['postal_code'].value = data.zonecode;
        form.elements['address'].value = data.roadAddress || data.jibunAddress;
        form.elements['address_detail'].focus();
    }}).open();
}
</script>

<script>
(function () {
    const input = document.getElementById('register_username');
    const message = document.getElementById('username_check_message');
    const button = document.getElementById('check_username_button');
    const form = document.getElementById('mono_register_form');
    let verifiedUsername = null;
    let requestSerial = 0;

    function showMessage(text, success) {
        message.textContent = text;
        message.style.color = success ? '#147d38' : '#c62828';
    }

    input.addEventListener('input', function () {
        verifiedUsername = null;
        requestSerial++;
        showMessage('아이디 중복 확인을 진행해 주세요.', false);
    });

    window.checkMonoUsername = async function () {
        const username = input.value.trim();
        verifiedUsername = null;
        if (!username) {
            showMessage('아이디를 입력해 주세요.', false);
            input.focus();
            return;
        }
        const serial = ++requestSerial;
        button.disabled = true;
        showMessage('중복 확인 중...', false);
        try {
            const response = await fetch('{{ url_for("check_username") }}', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: username,
                    csrf_token: form.elements['register_csrf'].value
                })
            });
            const data = await response.json();
            if (serial !== requestSerial || input.value.trim() !== username) return;
            if (response.ok && data.available === true) {
                verifiedUsername = username;
                showMessage('✓ ' + data.message, true);
            } else {
                showMessage(data.message || '중복 확인에 실패했습니다.', false);
            }
        } catch (error) {
            if (serial === requestSerial) showMessage('네트워크 오류가 발생했습니다. 다시 시도해 주세요.', false);
        } finally {
            button.disabled = false;
        }
    };

    form.addEventListener('submit', function (event) {
        if (verifiedUsername !== input.value.trim()) {
            event.preventDefault();
            showMessage('아이디 중복 확인을 먼저 진행해 주세요.', false);
            input.focus();
        }
    });
})();
</script>
</body>

</html>
