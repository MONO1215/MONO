<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        MONO 회원가입
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body class="user-login-body">


<div class="user-login-container">

    <a
        href="/"
        class="user-login-logo"
    >
        MONO
    </a>


    <div class="user-login-box">

        <h1>
            회원가입
        </h1>


        {% if error %}

        <div class="user-login-error">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">


            <div class="user-login-field">

                <label>
                    이름
                </label>

                <input
                    type="text"
                    name="name"
                    required
                >

            </div>


            <div class="user-login-field">

                <label>
                    아이디
                </label>

                <input
                    type="text"
                    name="username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="user-login-field">

                <label>
                    전화번호
                </label>

                <input
                    type="tel"
                    name="phone"
                    placeholder="010-1234-5678"
                >

            </div>


            <div class="user-login-field">

                <label>
                    이메일
                </label>

                <input
                    type="email"
                    name="email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="user-login-field">

                <label>
                    비밀번호
                </label>

                <input
                    type="password"
                    name="password"
                    autocomplete="new-password"
                    required
                >

            </div>


            <div class="user-login-field">

                <label>
                    비밀번호 확인
                </label>

                <input
                    type="password"
                    name="password_confirm"
                    autocomplete="new-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="user-login-button"
            >
                회원가입
            </button>

        </form>


        <a
            href="/login"
            class="user-register-link"
        >
            이미 계정이 있나요? 로그인
        </a>

    </div>

</div>


</body>

</html>
