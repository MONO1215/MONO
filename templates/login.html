<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        MONO 로그인
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body class="user-login-body">


<div class="user-login-container">

    <a
        href="/"
        class="user-login-logo"
    >
        MONO
    </a>


    <div class="user-login-box">

        <h1>
            로그인
        </h1>


        {% if error %}

        <div class="user-login-error">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            <div class="user-login-field">

                <label>
                    아이디
                </label>

                <input
                    type="text"
                    name="username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="user-login-field">

                <label>
                    비밀번호
                </label>

                <input
                    type="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="user-login-button"
            >
                로그인
            </button>

        </form>


        <a
            href="/register"
            class="user-register-link"
        >
            회원가입
        </a>

    </div>

</div>


</body>

</html>
