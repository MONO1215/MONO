<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회원정보 변경 | MONO 관리자</title><style>body{font-family:Arial,'Malgun Gothic',sans-serif;background:#f8f8f8;color:#111;margin:0}.wrap{max-width:700px;margin:45px auto;padding:0 20px}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{margin:12px 0}label{display:block;font-weight:600;margin-bottom:7px}input{width:100%;padding:11px;border:1px solid #ccc;border-radius:7px;box-sizing:border-box}button,.btn{display:inline-block;background:#111;color:white;border:0;border-radius:8px;padding:12px 18px;text-decoration:none;cursor:pointer}.muted{color:#666;font-size:13px}.error{color:#b00}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><p><a href="{{ url_for('admin_members') }}">← 회원 관리로 돌아가기</a></p><section class="card"><h1>회원정보 변경</h1><p class="muted">회원번호 #{{ member.id }} · 아이디 {{ member.username }} (아이디는 변경하지 않음)</p>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ member_csrf }}"><div class="grid"><div class="field"><label>이름</label><input name="name" required maxlength="100" value="{{ request.form.get('name', member.name or '') }}"></div><div class="field"><label>전화번호</label><input name="phone" maxlength="30" value="{{ request.form.get('phone', member.phone or '') }}"></div><div class="field"><label>이메일</label><input name="email" type="email" required maxlength="254" value="{{ request.form.get('email', member.email or '') }}"></div><div class="field"><label>우편번호</label><input name="postal_code" maxlength="5" pattern="[0-9]{5}" value="{{ request.form.get('postal_code', member.postal_code or '') }}"></div></div><div class="field"><label>주소</label><input name="address" maxlength="300" value="{{ request.form.get('address', member.address or '') }}"></div><div class="field"><label>상세 주소</label><input name="address_detail" maxlength="300" value="{{ request.form.get('address_detail', member.address_detail or '') }}"></div><div class="grid"><div class="field"><label>회원 레벨</label><input name="level" type="number" min="1" max="100" required value="{{ request.form.get('level', member.level or 1) }}"></div><div class="field"><label>보유 포인트 (P)</label><input name="point" type="number" min="0" max="1000000000" required value="{{ request.form.get('point', member.point or 0) }}"></div></div><p class="muted">포인트 수정은 회원의 결제 가능 잔액에 즉시 반영됩니다. 변경 전후 값을 별도로 기록해 주세요.</p><button type="submit">변경사항 저장</button> <a class="btn" href="{{ url_for('admin_members') }}" style="background:#777">취소</a></form></section></main></body></html>
